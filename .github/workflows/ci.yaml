# ci for product catalog service
name: Product Catalog Service CI
on:
  push:
  pull_request:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup go 1.22
        uses: actions/setup-go@v4
        with:
          go-version: 1.22
      - name: build
        run: |
         cd src/product-catalog
         go mod download
         go build -o product-catalog-service main.go

      - name: run tests
        run: |
          cd src/product-catalog
          go test  ./... 
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          golangci-lint run src/product-catalog/...
  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: install docker
        uses: docker/setup-buildx-action@v2
      - name: login to docker hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: docker build and push
        uses: docker/build-push-action@v6
        with:
          context: src/product-catalog/
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${github.run_id}
  updatek8s:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}
      - name: update tag in k8s deploy manifest
        run: |
          sed -i 's|image: .*|image: '"${{ secrets.DOCKER_USERNAME }}/product-catalog:${github.run_id}"'|g' kubernates/productcatalog/deploy.yaml
      - name: commit and push changes
        run: |
          git config --global user.name "hussainshaik111994@gma"
          git config --global user.email "hussainshaik111994@gmail.com"
          git add kubernates/productcatalog/deploy.yaml 
          git commit -m "[ci]update image tag to ${{ secrets.DOCKER_USERNAME }}/product-catalog:${github.run_id}"
          git push




